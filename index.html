<!-- __proto-gate-marker -->
<script>
(function () {
  try {
    if (sessionStorage.getItem("prototype-gate") === "unlocked") return;
  } catch (e) {}

  var hideStyle = document.createElement("style");
  hideStyle.textContent =
    'html.__proto-gated body > :not(#__proto-gate){display:none!important}' +
    'html.__proto-gated{background:#191919}';
  if (document.head) document.head.appendChild(hideStyle);
  else document.addEventListener("DOMContentLoaded", function () { document.head.appendChild(hideStyle); });
  document.documentElement.classList.add("__proto-gated");

  function build() {
    if (document.getElementById("__proto-gate")) return;
    var wrap = document.createElement("div");
    wrap.id = "__proto-gate";
    wrap.setAttribute(
      "style",
      "position:fixed;inset:0;background:#191919;color:#fff;font-family:'Nunito Sans',system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;z-index:2147483647;padding:16px;"
    );
    wrap.innerHTML =
      '<div style="background:#202020;border-radius:28px;padding:40px;width:100%;max-width:440px;box-sizing:border-box;">' +
        '<h1 style="margin:0 0 8px;font-size:28px;font-weight:700;letter-spacing:-0.02em;">Prototype access</h1>' +
        '<p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:rgba(255,255,255,0.7);">Enter the password to view the Envato pricing prototypes.</p>' +
        '<form id="__proto-gate-form" novalidate>' +
          '<label for="__proto-gate-input" style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">Password</label>' +
          '<input id="__proto-gate-input" type="password" autocomplete="current-password" placeholder="Enter password" style="display:block;width:100%;padding:12px 14px;font-size:15px;border-radius:12px;border:1px solid rgba(255,255,255,0.15);background:#161616;color:#fff;box-sizing:border-box;outline:none;" />' +
          '<div id="__proto-gate-error" style="display:none;margin-top:10px;color:#ff7a7a;font-size:13px;">Incorrect password. Please try again.</div>' +
          '<button type="submit" style="margin-top:20px;width:100%;padding:12px 14px;font-size:15px;font-weight:600;border:0;border-radius:12px;background:#fff;color:#000;cursor:pointer;">Unlock</button>' +
        '</form>' +
      '</div>';
    document.body.appendChild(wrap);
    var input = wrap.querySelector("#__proto-gate-input");
    var err = wrap.querySelector("#__proto-gate-error");
    var form = wrap.querySelector("#__proto-gate-form");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (input.value === "envatocam2026") {
        try { sessionStorage.setItem("prototype-gate", "unlocked"); } catch (e2) {}
        location.reload();
      } else {
        err.style.display = "block";
        input.focus();
        input.select();
      }
    });
    input.focus();
  }

  if (document.body) build();
  else document.addEventListener("DOMContentLoaded", build);
})();
</script>
<!-- /__proto-gate-marker -->
<!-- __proto-shortcut-marker -->
<script>
(function () {
  var HUB = "https://pepepardo13.github.io/Pepe-design-playground/iframe.html?id=prototype-experiment-hub--default&viewMode=story";
  function isTyping(el) {
    if (!el || el.nodeType !== 1) return false;
    var t = el.tagName;
    return t === "INPUT" || t === "TEXTAREA" || el.isContentEditable;
  }
  document.addEventListener("keydown", function (e) {
    if (e.isComposing || e.repeat || e.defaultPrevented) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k !== "Escape" && k !== "Esc" && k !== "r" && k !== "R") return;
    if (isTyping(e.target)) return;
    e.preventDefault();
    e.stopPropagation();
    (window.top || window).location.href = HUB;
  }, true);
})();
</script>
<!-- /__proto-shortcut-marker -->

<style>
/* Light theme for the site header on the external Variant 1 */
[class*="_header_"] {
  background: #fff5ed !important;
  color: #191919 !important;
}

[class*="_header_"] img[alt="Envato"] {
  filter: brightness(0) !important;
}

[class*="_searchBar_"] {
  background: #fff !important;
  border: 1px solid #ccc !important;
}

[class*="_searchDropdown_"] {
  color: #191919 !important;
}

[class*="_searchDivider_"] {
  background: #ccc !important;
}

[class*="_searchInput_"] {
  color: #707070 !important;
}

[class*="_bottomBar_"] {
  border-bottom: 1px solid rgba(0, 0, 0, 0.12) !important;
}

[class*="_bottomNavItem_"],
[class*="_headerLink_"] {
  color: #666 !important;
}

[class*="_headerCta_"] {
  background: #87e64b !important;
  color: #1a4200 !important;
}

/* Floating hamburger button (mobile only) */
.__proto-hamburger {
  display: none;
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 50;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 0;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.6);
  color: #191919;
  cursor: pointer;
  align-items: center;
  justify-content: center;
}

.__proto-hamburger svg {
  width: 24px;
  height: 24px;
}

@media (max-width: 720px) {
  /* Position the header relatively so the hamburger can anchor */
  [class*="_header_"] {
    position: relative !important;
  }

  /* Hide the desktop categories and right-side links so the hamburger replaces them */
  [class*="_bottomNav_"],
  [class*="_bottomBarDivider_"],
  [class*="_bottomBar_"] [class*="_bottomNavItem_"],
  [class*="_topBarActions_"] [class*="_headerLink_"],
  [class*="_topBarActions_"] [class*="_headerCta_"] {
    display: none !important;
  }

  [class*="_bottomBar_"] {
    display: none !important;
  }

  .__proto-hamburger {
    display: inline-flex !important;
  }
}
</style>
<script>
(function () {
  if (window.__protoHamburgerInstalled) return;
  window.__protoHamburgerInstalled = true;

  function ensureHamburger() {
    var header = document.querySelector('[class*="_header_"]');
    if (!header) return false;
    if (header.querySelector(".__proto-hamburger")) return true;

    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "__proto-hamburger";
    btn.setAttribute("aria-label", "Open navigation");
    btn.innerHTML = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>';
    header.appendChild(btn);
    return true;
  }

  function poll() {
    if (ensureHamburger()) return;
    setTimeout(poll, 200);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", poll);
  } else {
    poll();
  }

  var observer = new MutationObserver(function () {
    ensureHamburger();
  });
  observer.observe(document.body || document.documentElement, {
    childList: true,
    subtree: true,
  });
})();
</script>
