<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Envato Pricing Prototype</title>
    <style>
      :root {
        --cream: #fbefe7;
        --ink: #191919;
        --muted: #6b6b6b;
        --green: #8fe94b;
        --green-ink: #12210a;
        --line: #e6d9d0;
        --error: #c0362c;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--ink);
        background: var(--cream);
      }
      /* Gate */
      #gate {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: radial-gradient(120% 120% at 50% 0%, #fff5ef 0%, var(--cream) 60%);
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: #ffffff;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 32px 28px;
        box-shadow: 0 24px 60px -30px rgba(25, 25, 25, 0.35);
        text-align: center;
      }
      .badge {
        display: inline-block;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 14px;
      }
      h1 {
        font-size: 24px;
        line-height: 1.2;
        margin: 0 0 6px;
        font-weight: 700;
      }
      p.sub {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }
      form { display: flex; flex-direction: column; gap: 12px; }
      label {
        text-align: left;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
      }
      input[type="password"] {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        font-size: 16px;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      input[type="password"]:focus {
        border-color: #b9d98f;
        box-shadow: 0 0 0 3px rgba(143, 233, 75, 0.28);
      }
      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        background: var(--green);
        color: var(--green-ink);
        font-size: 16px;
        font-weight: 700;
        padding: 13px 16px;
        border-radius: 12px;
        transition: filter 0.15s ease, transform 0.05s ease;
      }
      button:hover { filter: brightness(0.96); }
      button:active { transform: translateY(1px); }
      .error {
        color: var(--error);
        font-size: 13px;
        min-height: 18px;
        text-align: left;
        margin: -4px 2px 0;
      }
      /* Prototype frame */
      #frameWrap { position: fixed; inset: 0; display: none; }
      #frameWrap iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="gate">
      <div class="card">
        <span class="badge">Envato · Confidential</span>
        <h1>Pricing Prototype</h1>
        <p class="sub">Enter the access password to view the prototype.</p>
        <form id="gateForm" autocomplete="off">
          <label for="pw">Password</label>
          <input id="pw" type="password" name="pw" autofocus placeholder="Enter password" />
          <div class="error" id="err" aria-live="polite"></div>
          <button type="submit">View prototype</button>
        </form>
      </div>
    </div>

    <div id="frameWrap"><!-- iframe injected on unlock --></div>

    <script>
      (function () {
        // Client-side gate only — deters casual access to this prototype share,
        // it is not real security. Password is normalised (trim + lowercase).
        var PASSWORD = "cam 2026";
        var STORY = "prototype-pricing-page-2-0--default";
        var STORY_URL = "iframe.html?id=" + STORY + "&viewMode=story";
        var KEY = "envato-proto-gate";

        var gate = document.getElementById("gate");
        var wrap = document.getElementById("frameWrap");
        var form = document.getElementById("gateForm");
        var input = document.getElementById("pw");
        var err = document.getElementById("err");

        function unlock() {
          if (!wrap.firstElementChild) {
            var f = document.createElement("iframe");
            f.setAttribute("title", "Envato Pricing Prototype");
            f.setAttribute("allow", "fullscreen");
            f.src = STORY_URL;
            wrap.appendChild(f);
          }
          gate.classList.add("hidden");
          wrap.style.display = "block";
        }

        try {
          if (sessionStorage.getItem(KEY) === "1") unlock();
        } catch (e) {}

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          var value = (input.value || "").trim().toLowerCase();
          if (value === PASSWORD) {
            try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
            err.textContent = "";
            unlock();
          } else {
            err.textContent = "Incorrect password. Please try again.";
            input.value = "";
            input.focus();
          }
        });
      })();
    </script>
  </body>
</html>
